<script id="server-sync-bridge">
async function syncFromServer() {
  try {
    const r = await fetch('/api/state', {cache: 'no-store'});
    if (!r.ok) return;
    const srv = await r.json();
    if (!window.__NOVIX) return;
    const { S } = window.__NOVIX;
    if (srv.recs && srv.recs['30s'] && srv.recs['30s'].length) {
      S.recs['30s'] = srv.recs['30s'];
    }
    if (srv.history && srv.history.length) S.history = srv.history;
    if (srv.pred && srv.pred.lastPeriod) Object.assign(S.pred, srv.pred);
    localStorage.setItem('wingo_master_history_v1', JSON.stringify(S.history));
    localStorage.setItem('wingo_master_prediction_v1', JSON.stringify({pred: S.pred}));
  } catch (e) {}
}

window.addEventListener('load', async () => {
  await syncFromServer();
  setTimeout(() => {
    const btn = document.getElementById('startBtn');
    if (btn && window.__NOVIX && !window.__NOVIX.S.running) btn.click();
  }, 800);
  setInterval(syncFromServer, 4000);
});
</script>
