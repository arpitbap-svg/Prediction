services:
  - type: web
    name: wingo-30s-cloud
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: POLL_SECONDS
        value: "30"
      - key: DATABASE_URL
        sync: false
